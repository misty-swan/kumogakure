[package]
name = "kumogakure-api"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Backend API and OGP image renderer for Kumogakure digital detox app"

[dependencies]
axum = "0.8"
fontdb = "0.23"
libsql = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
