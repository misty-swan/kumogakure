name: Kumogakure
options:
  bundleIdPrefix: app.kumogakure
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.3"
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ja
targets:
  Kumogakure:
    type: application
    platform: iOS
    sources:
      - path: Kumogakure/App
      - path: Kumogakure/Core
      - path: Kumogakure/DesignSystem
      - path: Kumogakure/Features
      - path: Kumogakure/Resources/Assets.xcassets
      - path: Kumogakure/Resources/Sounds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kumogakure.ios
        INFOPLIST_FILE: Kumogakure/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      run:
        storeKitConfiguration: Kumogakure/Resources/Kumogakure.storekit
      testTargets:
        - KumogakureTests
  KumogakureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KumogakureTests
      - path: Kumogakure/Resources/Kumogakure.storekit
        buildPhase: resources
    dependencies:
      - target: Kumogakure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kumogakure.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kumogakure.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kumogakure"
        BUNDLE_LOADER: "$(TEST_HOST)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
